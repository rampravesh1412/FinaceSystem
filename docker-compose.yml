# MongoDB as a SINGLE-NODE REPLICA SET.
#
# This is not optional. §38 of the brief requires multi-document ACID transactions for
# every money movement (validate -> create txn -> post ledger lines -> bump balances ->
# audit -> commit). A standalone mongod cannot start a session transaction; it fails with
# "Transaction numbers are only allowed on a replica set member or mongos".
#
#   npm run db:up      start + wait until the replica set has elected a primary
#   npm run db:reset   nuke the volume and start clean

services:
  mongo:
    image: mongo:7
    container_name: amiri-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first boot, then reports healthy once a PRIMARY exists.
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }
        "
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  mongo-express:
    image: mongo-express:1.0.2
    container_name: amiri-mongo-express
    restart: unless-stopped
    profiles: ["tools"]        # docker compose --profile tools up -d
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/?replicaSet=rs0
      ME_CONFIG_BASICAUTH: "false"

volumes:
  mongo-data:
